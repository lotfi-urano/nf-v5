# Project-wide Gradle settings.

# JVM args - memory tuning for build
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Parallelism
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Suppress configuration-cache for now (avoids edge-case crashes with AGP 9.x)
org.gradle.configuration-cache=false

# Java toolchain - explicitly use Java 17 for maximum compatibility
# AGP 9.x + Gradle 8.x work best with Java 17
# If you have JDK 17 installed, uncomment the next line and set the path:
# org.gradle.java.home=/path/to/jdk-17
